<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIF Converter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      color-scheme: light;
      --bg: #e8e6e3;
      --surface: #eeece9;
      --surface2: #e2e0dd;
      --border: #d4d2cf;
      --border2: #c8c6c3;
      --text: #2a2826;
      --text-2: #6b6865;
      --text-3: #9c9a97;
      --accent: #1a1816;
      --ready-bg: #1e2b1e;
      --ready-text: #5ecb6a;
      --error-bg: #2b1e1e;
      --error-text: #e06060;
      --warning-bg: #2b2718;
      --warning-text: #d4aa40;
      --radius: 3px;
      --compact-control-height: 24px;
      --mono: 'DM Mono', ui-monospace, monospace;
      --sans: 'DM Sans', system-ui, sans-serif;
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font-family: inherit;
      font-size: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .header {
      padding: 18px 20px 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header-title h1 {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dropzone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(420px, 100%);
      min-height: 54px;
      padding: 0 16px;
      border: 1px dashed var(--border2);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-3);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      transition: background 0.1s, border-color 0.1s;
    }

    .dropzone.is-dragging {
      border-color: var(--accent);
      background: #f5f3f0;
      color: var(--text);
    }

    .dropzone strong {
      display: none;
    }

    .dropzone p {
      color: inherit;
    }

    .dropzone:hover {
      background: var(--surface2);
    }

    .btn {
      padding: 5px 11px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      font-weight: 400;
      transition: background 0.1s, border-color 0.1s;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--border);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .main {
      padding: 0;
      overflow-x: auto;
    }

    .table-wrap {
      margin-top: 0;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: transparent;
      border: 0;
      font-size: 12.5px;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      padding: 7px 10px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-3);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      padding: 6px 10px;
      color: var(--text);
    }

    tbody tr.row {
      border-bottom: 1px solid var(--border);
      transition: background 0.08s;
    }

    tbody tr.row:hover {
      background: var(--surface2);
    }

    td.file-name {
      white-space: normal;
      min-width: 180px;
      font-size: 12.5px;
      font-weight: 500;
    }

    .event-input {
      width: 76px;
      height: var(--compact-control-height);
      padding: 0 5px;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      transition: border-color 0.1s, background 0.1s;
    }

    .event-input:focus {
      border-color: var(--accent);
      background: #f5f3f0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 2px;
      border: 1px solid;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.4px;
      font-weight: 500;
    }

    .status.ok {
      border-color: #3a5a3a;
      background: var(--ready-bg);
      color: var(--ready-text);
    }

    .status.warn {
      border-color: #5a5030;
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .status.error {
      border-color: #5a3a3a;
      background: var(--error-bg);
      color: var(--error-text);
    }

    @media (max-width: 700px) {
      .control-row {
        gap: 12px;
      }

      .dropzone {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="header-title">
        <h1>lif converter</h1>
      </div>

      <div class="controls">
        <div class="control-row">
          <input id="fileInput" type="file" accept=".lif,.LIF,text/plain" multiple>

          <label class="dropzone" id="dropzone" for="fileInput">
            <span>upload or drop .lif files</span>
          </label>
          <button class="btn" id="convertAll" disabled>download all</button>
          <button class="btn" id="downloadZip" disabled>download zip</button>
          <button class="btn" id="clearFiles" disabled>clear</button>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>file</th>
              <th>event</th>
              <th>new event</th>
              <th>new file</th>
              <th>rows</th>
              <th>first split</th>
              <th>status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="fileRows"></tbody>
        </table>
      </div>

    </main>
  </div>

  <script>
    const fileInput = document.querySelector("#fileInput");
    const dropzone = document.querySelector("#dropzone");
    const fileRows = document.querySelector("#fileRows");
    const convertAll = document.querySelector("#convertAll");
    const downloadZip = document.querySelector("#downloadZip");
    const clearFiles = document.querySelector("#clearFiles");

    const EVENT_NUMBER_COLUMN = 0;
    const IDENTITY_COLUMNS = 6;
    const SPLIT_LIST_COLUMN = 10;
    const DEFAULT_EVENT_OFFSET = 100;

    let loadedFiles = [];

    fileInput.addEventListener("change", () => loadFiles(fileInput.files));

    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropzone.classList.add("is-dragging");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("is-dragging");
    });

    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzone.classList.remove("is-dragging");
      loadFiles(event.dataTransfer.files);
    });

    convertAll.addEventListener("click", () => {
      loadedFiles.forEach((item) => {
        if (!item.error) downloadConvertedFile(item);
      });
    });

    downloadZip.addEventListener("click", downloadConvertedZip);

    clearFiles.addEventListener("click", () => {
      loadedFiles = [];
      fileInput.value = "";
      renderTable();
    });

    async function loadFiles(fileList) {
      const files = Array.from(fileList).filter((file) => file.name.toLowerCase().endsWith(".lif"));
      const parsed = await Promise.all(files.map(readAndParseFile));
      loadedFiles = loadedFiles.concat(parsed);
      renderTable();
    }

    function readAndParseFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const text = String(reader.result || "");
            resolve(analyzeLifFile(file.name, text));
          } catch {
            resolve({
              id: makeId(),
              fileName: file.name,
              text: "",
              error: "could not parse file."
            });
          }
        };
        reader.onerror = () => {
          resolve({
            id: makeId(),
            fileName: file.name,
            text: "",
            error: "could not read file"
          });
        };
        reader.readAsText(file);
      });
    }

    function analyzeLifFile(fileName, text) {
      const rows = parseCsv(text);
      const item = {
        id: makeId(),
        fileName,
        text,
        rows,
        originalEvent: "",
        newEvent: "",
        newFileName: "",
        convertedRows: 0,
        firstSplitTime: "",
        warnings: [],
        error: ""
      };

      if (!rows.length || !rows[0].length) {
        item.error = "file is empty";
        return item;
      }

      item.originalEvent = rows[0][EVENT_NUMBER_COLUMN] || "";
      const numericEvent = Number.parseInt(item.originalEvent, 10);
      item.newEvent = Number.isFinite(numericEvent)
        ? String(numericEvent + DEFAULT_EVENT_OFFSET)
        : item.originalEvent;
      item.newFileName = makeOutputName(fileName, item.newEvent);

      const converted = buildConvertedRows(item);
      item.convertedRows = Math.max(0, converted.rows.length - 1);
      item.firstSplitTime = converted.firstSplitTime;
      item.warnings = converted.warnings;
      item.error = converted.error;
      return item;
    }

    function buildConvertedRows(item) {
      const warnings = [];
      const output = [];

      if (!item.rows.length) {
        return { rows: [], firstSplitTime: "", warnings, error: "no rows found" };
      }

      const header = item.rows[0].slice(0, IDENTITY_COLUMNS);
      header[EVENT_NUMBER_COLUMN] = item.newEvent;
      while (header.length < IDENTITY_COLUMNS) header.push("");
      header.push("");
      output.push(header);

      let firstSplitTime = "";
      let convertedCount = 0;
      for (let rowIndex = 1; rowIndex < item.rows.length; rowIndex += 1) {
        const row = item.rows[rowIndex];
        if (row.length === 1 && row[0].trim() === "") continue;

        const identity = row.slice(0, IDENTITY_COLUMNS);
        while (identity.length < IDENTITY_COLUMNS) identity.push("");

        const splitField = row[SPLIT_LIST_COLUMN] || "";
        const splitTime = getSecondToLastSplitTime(splitField);
        if (!splitTime) {
          warnings.push(`Row ${rowIndex + 1}: could not find a second-to-last split.`);
        } else {
          convertedCount += 1;
        }

        if (!firstSplitTime && splitTime) firstSplitTime = splitTime;
        output.push(identity.concat(splitTime));
      }

      let error = "";
      if (output.length <= 1) {
        error = "no athlete rows found";
      } else if (convertedCount === 0) {
        error = "no splits found";
      }
      return { rows: output, firstSplitTime, warnings, error };
    }

    function getSecondToLastSplitTime(splitField) {
      const splits = splitField
        .split(",")
        .map((part) => part.trim())
        .filter(Boolean);

      if (splits.length < 2) return "";

      const split = splits[splits.length - 2];
      const match = split.match(/^([0-9]+(?::[0-9]{1,2})?(?:\.[0-9]+)?)/);
      return match ? match[1] : "";
    }

    function makeOutputName(fileName, newEvent) {
      const match = fileName.match(/^(\d+)(-.+\.lif)$/i);
      if (match) return `${newEvent}${match[2]}`;

      const dotIndex = fileName.lastIndexOf(".");
      if (dotIndex >= 0) return `${fileName.slice(0, dotIndex)}-${newEvent}${fileName.slice(dotIndex)}`;
      return `${fileName}-${newEvent}.lif`;
    }

    function hasDownloadableFiles() {
      return loadedFiles.some((item) => !item.error);
    }

    function renderTable() {
      fileRows.innerHTML = "";
      convertAll.disabled = !hasDownloadableFiles();
      downloadZip.disabled = !hasDownloadableFiles();
      clearFiles.disabled = loadedFiles.length === 0;

      if (loadedFiles.length === 0) {
        return;
      }

      loadedFiles.forEach((item) => {
        const tr = document.createElement("tr");
        tr.className = "row";

        tr.appendChild(cell(item.fileName, "file-name"));
        tr.appendChild(cell(item.originalEvent || "unknown"));

        const inputCell = document.createElement("td");
        const input = document.createElement("input");
        input.className = "event-input";
        input.value = item.newEvent;
        input.inputMode = "numeric";
        input.addEventListener("input", () => {
          item.newEvent = input.value.trim();
          item.newFileName = makeOutputName(item.fileName, item.newEvent || "new");
          const converted = buildConvertedRows(item);
          item.convertedRows = Math.max(0, converted.rows.length - 1);
          item.firstSplitTime = converted.firstSplitTime;
          item.warnings = converted.warnings;
          item.error = converted.error;
          renderTable();
        });
        inputCell.appendChild(input);
        tr.appendChild(inputCell);

        tr.appendChild(cell(item.newFileName));
        tr.appendChild(cell(String(item.convertedRows)));
        tr.appendChild(cell(item.firstSplitTime || "-"));

        const statusCell = document.createElement("td");
        const status = document.createElement("span");
        if (item.error) {
          status.className = "status error";
          status.textContent = item.error;
        } else if (item.warnings.length) {
          status.className = "status warn";
          status.textContent = `${item.warnings.length} warning${item.warnings.length === 1 ? "" : "s"}`;
          status.title = item.warnings.join("\n");
        } else {
          status.className = "status ok";
          status.textContent = "ready";
        }
        statusCell.appendChild(status);
        tr.appendChild(statusCell);

        const buttonCell = document.createElement("td");
        const button = document.createElement("button");
        button.className = "btn";
        button.textContent = "download";
        button.disabled = Boolean(item.error);
        button.addEventListener("click", () => downloadConvertedFile(item));
        buttonCell.appendChild(button);
        tr.appendChild(buttonCell);

        fileRows.appendChild(tr);
      });
    }

    function cell(text, className = "") {
      const td = document.createElement("td");
      if (className) td.className = className;
      td.textContent = text;
      return td;
    }

    function downloadConvertedFile(item) {
      if (item.error) return;

      const csv = getConvertedText(item);
      if (!csv) return;

      const blob = new Blob([csv], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = item.newFileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadConvertedZip() {
      const files = loadedFiles
        .filter((item) => !item.error)
        .map((item) => ({
          name: item.newFileName,
          text: getConvertedText(item)
        }))
        .filter((file) => file.text);

      if (!files.length) return;

      const blob = createZipBlob(files);
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "hytek-lifs.zip";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function getConvertedText(item) {
      const converted = buildConvertedRows(item);
      if (converted.error) return "";
      return serializeCsv(converted.rows);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];

        if (inQuotes) {
          if (char === "\"" && next === "\"") {
            field += "\"";
            index += 1;
          } else if (char === "\"") {
            inQuotes = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === "\"") {
          inQuotes = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      if (field.length || row.length) {
        row.push(field.replace(/\r$/, ""));
        rows.push(row);
      }

      return rows;
    }

    function serializeCsv(rows) {
      return rows.map((row) => row.map(formatCsvField).join(",")).join("\r\n") + "\r\n";
    }

    function formatCsvField(value) {
      const text = String(value ?? "");
      if (/[",\r\n]/.test(text)) {
        return `"${text.replace(/"/g, "\"\"")}"`;
      }
      return text;
    }

    function makeId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return `file-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function createZipBlob(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      files.forEach((file) => {
        const nameBytes = encoder.encode(file.name);
        const dataBytes = encoder.encode(file.text);
        const crc = crc32(dataBytes);

        const localHeader = new Uint8Array(30 + nameBytes.length);
        const localView = new DataView(localHeader.buffer);
        localView.setUint32(0, 0x04034b50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, 0, true);
        localView.setUint16(12, 0, true);
        localView.setUint32(14, crc, true);
        localView.setUint32(18, dataBytes.length, true);
        localView.setUint32(22, dataBytes.length, true);
        localView.setUint16(26, nameBytes.length, true);
        localView.setUint16(28, 0, true);
        localHeader.set(nameBytes, 30);

        localParts.push(localHeader, dataBytes);

        const centralHeader = new Uint8Array(46 + nameBytes.length);
        const centralView = new DataView(centralHeader.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, 0, true);
        centralView.setUint16(14, 0, true);
        centralView.setUint32(16, crc, true);
        centralView.setUint32(20, dataBytes.length, true);
        centralView.setUint32(24, dataBytes.length, true);
        centralView.setUint16(28, nameBytes.length, true);
        centralView.setUint16(30, 0, true);
        centralView.setUint16(32, 0, true);
        centralView.setUint16(34, 0, true);
        centralView.setUint16(36, 0, true);
        centralView.setUint32(38, 0, true);
        centralView.setUint32(42, offset, true);
        centralHeader.set(nameBytes, 46);

        centralParts.push(centralHeader);
        offset += localHeader.length + dataBytes.length;
      });

      const centralSize = centralParts.reduce((total, part) => total + part.length, 0);
      const endHeader = new Uint8Array(22);
      const endView = new DataView(endHeader.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(4, 0, true);
      endView.setUint16(6, 0, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, offset, true);
      endView.setUint16(20, 0, true);

      return new Blob([...localParts, ...centralParts, endHeader], { type: "application/zip" });
    }

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (let index = 0; index < bytes.length; index += 1) {
        crc ^= bytes[index];
        for (let bit = 0; bit < 8; bit += 1) {
          crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
        }
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    renderTable();
  </script>
</body>

</html>
